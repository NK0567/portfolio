# Déploiement complet sur un seul serveur (VPS) : base, API, site.
#
#   cp .env.example .env      # puis remplir les valeurs
#   docker compose up -d --build
#   docker compose exec api npm run db:seed   # une seule fois, crée l'admin
#
# Un reverse proxy (Caddy, Nginx, Traefik) doit exposer en HTTPS :
#   https://<domaine>      -> web:3000
#   https://api.<domaine>  -> api:8080
# Le HTTPS n'est pas optionnel : le cookie de session est `secure` en production.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uportfolio", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 10
    # Aucun port publié : la base n'est joignable que par l'API.

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: mysql://portfolio:${DB_PASSWORD}@db:3306/portfolio_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET manquant}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET manquant}
      CORS_ORIGIN: ${SITE_URL:?SITE_URL manquant}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      # Les fichiers envoyés depuis l'administration survivent aux redéploiements.
      - uploads:/app/public/uploads
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:?API_URL manquant}/api
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Le rendu serveur joint l'API par le réseau Docker, sans repasser par Internet.
      API_INTERNAL_URL: http://api:8080/api
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  uploads:
